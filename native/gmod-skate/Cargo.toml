[package]
name = "gmod-skate"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "gmcl_skate3"
crate-type = ["cdylib", "rlib"]

[dependencies]
skate-bridge = { path = "../skate-bridge" }
glam.workspace = true
# XInput on Windows: what Proton implements best. evdev on Linux either way.
gilrs = { version = "0.11.2", default-features = false, features = ["xinput"] }
libloading = "0.8"
