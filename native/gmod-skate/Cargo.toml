[package]
name = "gmod-skate"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "gmcl_skate3"
crate-type = ["cdylib", "rlib"]

[dependencies]
skate-bridge = { path = "../skate-bridge" }
skate-aems = { path = "../skate-aems" }
glam.workspace = true
serde_json = "1"
# XInput on Windows: what Proton implements best. evdev on Linux either way.
gilrs = { version = "0.11.2", default-features = false, features = ["xinput"] }
libloading = "0.8"
lzma-rs = "0.3"
cpal = "0.18.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Apple's GameController framework, which reads a PS5 pad in the mode Steam
# switches it to over Bluetooth; gilrs's raw HID only sees the basic report.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSString"] }
objc2-game-controller = { version = "0.3", default-features = false, features = ["std", "GCController", "GCExtendedGamepad", "GCPhysicalInputProfile", "GCControllerElement", "GCControllerButtonInput", "GCControllerAxisInput", "GCControllerDirectionPad", "GCDevice"] }
