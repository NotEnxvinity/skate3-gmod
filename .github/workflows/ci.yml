name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo run -p skate-headless
      - run: bash -n setup/skate3-gmod-setup.sh && python3 -m py_compile setup/convert.py
      - run: sudo apt-get install -y -q luajit && for f in $(find addon -name '*.lua'); do luajit -bl "$f" > /dev/null; done

  # Built on Debian 11 so the module needs nothing newer than glibc 2.31,
  # which the Steam Linux Runtime provides.
  linux:
    runs-on: ubuntu-latest
    container: rust:1-bullseye
    steps:
      - uses: actions/checkout@v4
      # Debian 11 left the main mirrors when its LTS ended; fall back to the archive.
      - run: |
          if ! apt-get update -q; then
            echo "deb http://archive.debian.org/debian bullseye main" > /etc/apt/sources.list
            rm -f /etc/apt/sources.list.d/*
            apt-get -o Acquire::Check-Valid-Until=false update -q
          fi
          apt-get install -y -q libudev-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p gmod-skate -p skate-headless
      - run: |
          mkdir -p out
          cp target/release/libgmcl_skate3.so out/gmcl_skate3_linux64.dll
          cp target/release/skate-headless out/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: out

  # For Garry's Mod running under Proton.
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q gcc-mingw-w64-x86-64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p gmod-skate --target x86_64-pc-windows-gnu
      - run: mkdir -p out && cp target/x86_64-pc-windows-gnu/release/gmcl_skate3.dll out/gmcl_skate3_win64.dll
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: out

  # One download laid out like the game folder, plus the setup tools.
  package:
    runs-on: ubuntu-latest
    needs: [linux, windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: builds
      - run: |
          root=dist/skate3-gmod
          mkdir -p "$root/garrysmod/lua/bin" "$root/garrysmod/addons/skate3"
          cp builds/linux-build/gmcl_skate3_linux64.dll builds/windows-build/gmcl_skate3_win64.dll "$root/garrysmod/lua/bin/"
          cp -r addon/lua "$root/garrysmod/addons/skate3/"
          cp builds/linux-build/skate-headless "$root/"
          cp -r setup "$root/"
          cp README.md NOTICE "$root/"
      - uses: actions/upload-artifact@v4
        with:
          name: skate3-gmod-linux-x64
          path: dist
