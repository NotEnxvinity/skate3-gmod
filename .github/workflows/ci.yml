name: ci
on:
  push:
    branches: [main]
    # A v* tag (or publishing a release with one) also puts the setup apps
    # on that GitHub release.
    tags: ['v*']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q libudev-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: native/patch-engine.sh
      - run: cargo test --workspace
      - run: cargo run -p skate-headless
      - run: bash -n setup/skate3-gmod-setup.sh && python3 -m py_compile setup/*.py
      - name: Fetch the engine's tools for the setup tests
        run: |
          rev=$(sed -n 's/^ENGINE_REV=//p' setup/skate3-gmod-setup.sh)
          git init -q engine
          git -C engine remote add origin https://github.com/SK8-ENGINE/skate-3-rust-engine
          git -C engine fetch -q --depth 1 origin "$rev"
          git -C engine checkout -q FETCH_HEAD
      - name: Setup tests, decoding with vgmstream
        run: |
          python3 -m pip install -q numpy==2.2.6
          mkdir -p vgmstream
          curl -sSfL https://github.com/vgmstream/vgmstream-releases/releases/download/nightly/vgmstream-linux-cli.tar.gz | tar xz -C vgmstream
          SKATE3_ENGINE=$PWD/engine SKATE3_VGMSTREAM=$PWD/vgmstream/vgmstream-cli python3 -m unittest discover -s setup -p 'test_*.py'
      - run: sudo apt-get install -y -q luajit && for f in $(find addon -name '*.lua'); do luajit -bl "$f" > /dev/null; done

  # Linked against glibc 2.31 with zig, so the module loads inside the Steam
  # Linux Runtime as well as on a current SteamOS host.
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q libudev-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: native/patch-engine.sh
      - run: python3 -m pip install --user --break-system-packages ziglang==0.16.0 && cargo install --locked cargo-zigbuild
      - run: cargo zigbuild --release -p gmod-skate -p skate-headless --target x86_64-unknown-linux-gnu.2.31
      - run: |
          mkdir -p out
          cp target/x86_64-unknown-linux-gnu/release/libgmcl_skate3.so out/gmcl_skate3_linux64.dll
          cp target/x86_64-unknown-linux-gnu/release/skate-headless out/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: out

  # For Garry's Mod running under Proton.
  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q gcc-mingw-w64-x86-64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - run: native/patch-engine.sh
      - run: cargo build --release -p gmod-skate --target x86_64-pc-windows-gnu
      - run: mkdir -p out && cp target/x86_64-pc-windows-gnu/release/gmcl_skate3.dll out/gmcl_skate3_win64.dll
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: out

  # The setup players run once: a plain folder of our own scripts (the .bat,
  # .sh and .command launchers) with both modules, zipped. The launcher fetches
  # the engine's converters and vgmstream on the player's machine. Never a
  # PyInstaller exe: those get flagged as viruses. The Mac module is built by
  # hand on a Mac, so the Mac zip is made and attached by hand.
  setup-zip:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: builds
      - run: |
          mkdir -p modules
          cp builds/linux-build/gmcl_skate3_linux64.dll builds/windows-build/gmcl_skate3_win64.dll modules/
          python3 setup/package.py --folder --modules modules --out dist/S3GM-setup
          cp LICENSE NOTICE dist/S3GM-setup/
          mkdir -p dist/S3GM-setup/LICENSES
          cp LICENSES/Apache-2.0.txt dist/S3GM-setup/LICENSES/
          cp native/skate-xma/COPYING.LGPL dist/S3GM-setup/LICENSES/LGPL-2.1-skate-xma.txt
          chmod +x dist/S3GM-setup/*.sh dist/S3GM-setup/*.command
          (cd dist && zip -q -r -X ../S3GM-setup.zip S3GM-setup)
      - uses: actions/upload-artifact@v4
        with:
          name: S3GM-setup
          path: S3GM-setup.zip

  # One download laid out like the game folder, plus the setup tools.
  package:
    runs-on: ubuntu-24.04
    needs: [linux, windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: builds
      - run: |
          root=dist/skate3-gmod
          mkdir -p "$root/garrysmod/lua/bin" "$root/garrysmod/addons/skate3"
          cp builds/linux-build/gmcl_skate3_linux64.dll builds/windows-build/gmcl_skate3_win64.dll "$root/garrysmod/lua/bin/"
          cp -r addon/lua "$root/garrysmod/addons/skate3/"
          cp builds/linux-build/skate-headless "$root/"
          cp -r setup "$root/"
          cp README.md NOTICE "$root/"
      - uses: actions/upload-artifact@v4
        with:
          name: skate3-gmod-linux-x64
          path: dist

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, setup-zip]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: S3GM-setup
          path: builds
      # Publishing a release on GitHub's releases page makes the tag, so the
      # release may already exist; then the download is added to it.
      - run: |
          file="S3GM-$GITHUB_REF_NAME.zip"
          mv builds/S3GM-setup.zip "$file"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "$file"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Skate 3 for Garry's Mod $GITHUB_REF_NAME" --generate-notes "$file"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
